<!doctype html>
<meta charset="utf-8">
<title>audio browser test</title>
<pre id="out">running</pre>
<script type="module">
const out = { decode: { ok: 0, fail: [], durationMismatch: [], totalSeconds: 0, totalBytes: 0, byKind: {} }, module: {}, errors: [] };
const post = () => { document.getElementById('out').textContent = JSON.stringify(out); };
window.addEventListener('error', (e) => out.errors.push(String(e.message)));
window.addEventListener('unhandledrejection', (e) => out.errors.push('rejection: ' + String(e.reason && e.reason.message || e.reason)));
try {
  const ac = new AudioContext();
  out.contextState = ac.state; out.sampleRate = ac.sampleRate;
  const pack = await (await fetch('/assets/generated/audio/pack.json')).json();
  const jobs = [];
  for (const [name, e] of Object.entries(pack)) (e.variants || [e.url]).forEach((u, i) => jobs.push({ name, u, kind: e.kind, expect: e.durations && e.durations[i] }));
  out.decode.files = jobs.length; out.decode.names = Object.keys(pack).length;
  let next = 0;
  const worker = async () => {
    while (next < jobs.length) {
      const j = jobs[next++];
      try {
        const r = await fetch(j.u);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const ab = await r.arrayBuffer();
        out.decode.totalBytes += ab.byteLength;
        const size = ab.byteLength;
        const buf = await ac.decodeAudioData(ab);
        const ch = buf.getChannelData(0);
        let peak = 0; for (let i = 0; i < ch.length; i += 7) peak = Math.max(peak, Math.abs(ch[i]));
        out.decode.ok++;
        out.decode.totalSeconds += buf.duration;
        const k = (out.decode.byKind[j.kind] ??= { files: 0, seconds: 0, bytes: 0, channels: buf.numberOfChannels });
        k.files++; k.seconds = +(k.seconds + buf.duration).toFixed(1); k.bytes += size;
        if (j.expect && Math.abs(buf.duration - j.expect) > 0.1) out.decode.durationMismatch.push([j.u, +buf.duration.toFixed(3), j.expect]);
        if (peak < 0.02) out.decode.fail.push([j.u, 'near silent peak ' + peak.toFixed(4)]);
        if (j.kind === 'oneshot' && buf.numberOfChannels !== 1) out.decode.fail.push([j.u, 'channels ' + buf.numberOfChannels]);
        (out.decode.list ??= []).push([j.u.split('/').pop(), +buf.duration.toFixed(2), buf.numberOfChannels]);
      } catch (err) { out.decode.fail.push([j.u, String(err && err.message || err)]); }
    }
  };
  await Promise.all(Array.from({ length: 6 }, worker));
  out.decode.totalSeconds = +out.decode.totalSeconds.toFixed(1);

  // media element streaming of a music file
  const m = Object.values(pack).find((e) => e.kind === 'music');
  if (m) {
    const el = new Audio(); el.src = m.url;
    out.module.mediaDuration = await new Promise((res) => { el.addEventListener('loadedmetadata', () => res(el.duration)); el.addEventListener('error', () => res('error')); setTimeout(() => res('timeout'), 8000); });
    out.module.mediaCanOgg = el.canPlayType('audio/ogg; codecs=opus');
  }

  // the real module on a real AudioContext
  const events = (() => { const mp = new Map(); return { on(n, f) { if (!mp.has(n)) mp.set(n, new Set()); mp.get(n).add(f); return () => mp.get(n).delete(f); }, emit(n, p) { for (const f of [...(mp.get(n) || [])]) f(p); } }; })();
  const world = {};
  const cleanups = [];
  const sent = [];
  const ctx = {
    audio: { context: ac, listener: {} }, state: {}, world, events, quality: { tier: 'pc' }, clock: { t: 0, dt: 0.016 },
    player: { head: { x: 0, y: 1.6, z: 0 }, feet: { x: 0, y: 0, z: 0 }, forward: { x: 0, y: 0, z: -1 } }, input: {}, groundAt: () => 0,
    net: { send: (msg) => { sent.push(msg); return true; } }, scene: { children: [] },
    on: (n, f) => cleanups.push(events.on(n, f)), onDispose: (f) => cleanups.push(f), provide: (n, a) => { world[n] = a; },
  };
  const mod = await import('/game/core/audio.js?v=browser');
  const inst = mod.default(ctx);
  await new Promise((r) => setTimeout(r, 1500));
  const A = world.audio;
  await A.preload(['ui-tick', 'slash-flesh']);
  out.module.state = ac.state;
  out.module.sfxFlesh = A.sfx('slash-flesh', { at: { x: 2, y: 1, z: 1 } });
  out.module.stats = A.stats();
  out.module.moodSet = A.setMood('calm');
  await new Promise((r) => setTimeout(r, 1500));
  inst.update(0.2, 1); ctx.clock.t = 1; ac.state === 'running' && inst.update(0.3, 1.3);
  out.module.mood = A.mood;
  out.module.unknownIdentifier = A.sfx('no-such-thing');
  out.module.sentRequests = sent.length;
  A.bed('amb-forest');
  await new Promise((r) => setTimeout(r, 1500));
  out.module.bed = A.stats().bed;
  inst.dispose();
} catch (err) { out.errors.push('fatal: ' + (err && err.stack || err)); }
out.done = true;
post();
</script>
